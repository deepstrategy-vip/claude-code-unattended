name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python dependencies.py --claude-dir "${RUNNER_TEMP:?}/ccu-deps"
      - run: python -m unittest discover -s tests -v
        env:
          CCU_SHFMT: ${{ runner.temp }}/ccu-deps/tools/shfmt/shfmt
